services:
     
  chromadb:
    image: chromadb/chroma:1.0.16
    container_name: chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./data/chromadb:/data
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - PERSIST_DIRECTORY=/data
      # Proxy-Konfiguration für ChromaDB
      - http_proxy=http://proxy.th-wildau.de:8080
      - https_proxy=http://proxy.th-wildau.de:8080
      - no_proxy=localhost,127.0.0.1,.th-wildau.de
      - NO_PROXY=localhost,127.0.0.1,.th-wildau.de,chromadb
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "timeout 5 bash -c '</dev/tcp/localhost/8000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
     
  python_app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Proxy-Konfiguration für Build-Phase
        - http_proxy=http://proxy.th-wildau.de:8080
        - https_proxy=http://proxy.th-wildau.de:8080
        - no_proxy=localhost,127.0.0.1,.th-wildau.de
    container_name: python_app
    depends_on:
      chromadb:
        condition: service_healthy
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_HTTP_URL=http://chromadb:8000
      # Proxy-Konfiguration für Laufzeit
      - http_proxy=http://proxy.th-wildau.de:8080
      - https_proxy=http://proxy.th-wildau.de:8080
      - no_proxy=localhost,127.0.0.1,.th-wildau.de,chromadb
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
    working_dir: /app
    restart: unless-stopped
    networks:
      - app_network

volumes:
  chromadb_data:
    driver: local
    
networks:
  app_network:
    driver: bridge