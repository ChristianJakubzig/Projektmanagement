services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app_network
      
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./data/chromadb:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
      
  python_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_app
    depends_on:
      chromadb:
        condition: service_healthy
    environment:
      - OLLAMA_URL=http://ollama:11434
      - CHROMADB_URL=http://chromadb:8000
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
    working_dir: /app
    restart: unless-stopped
    networks:
      - app_network
    # Entferne den command override für VS Code Dev Containers
    # command: sh -c "sleep 45 && python your_script.py"

volumes:
  ollama_data:

networks:
  app_network:
    driver: bridge