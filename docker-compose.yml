services:
     
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./data/chromadb:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
      # Proxy-Konfiguration für ChromaDB
      - http_proxy=http://proxy.th-wildau.de:8080
      - https_proxy=http://proxy.th-wildau.de:8080
      - no_proxy=localhost,127.0.0.1,.th-wildau.de
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
     
  python_app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Proxy-Konfiguration für Build-Phase
        - http_proxy=http://proxy.th-wildau.de:8080
        - https_proxy=http://proxy.th-wildau.de:8080
        - no_proxy=localhost,127.0.0.1,.th-wildau.de
    container_name: python_app
    depends_on:
      chromadb:
        condition: service_healthy
    environment:
      - CHROMADB_URL=http://chromadb:8000
      # Proxy-Konfiguration für Laufzeit
      - http_proxy=http://proxy.th-wildau.de:8080
      - https_proxy=http://proxy.th-wildau.de:8080
      - no_proxy=localhost,127.0.0.1,.th-wildau.de,chromadb
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
    working_dir: /app
    restart: unless-stopped
    networks:
      - app_network

volumes:
  chromadb_data:
    driver: local
    
networks:
  app_network:
    driver: bridge